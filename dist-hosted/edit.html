<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>附件描述 — 编辑</title>
    <script type="module" crossorigin src="https://env-00jy6try6vgy-static.normal.cloudstatic.cn/status-peek/assets/edit-7swQhXWb.js"></script>
    <link rel="modulepreload" crossorigin href="https://env-00jy6try6vgy-static.normal.cloudstatic.cn/status-peek/assets/shared-CHzyydpf.js">
    <link rel="modulepreload" crossorigin href="https://env-00jy6try6vgy-static.normal.cloudstatic.cn/status-peek/assets/style--llhUxwj.js">
  </head>
  <body>
    <div class="modal-wrap">
      <div class="modal-title" id="target">（未选择物件）</div>
      <div class="modal-sub" id="sub"></div>

      <div class="modal-label">
        <span>描述文本</span>
        <span id="counter">0 / 4000</span>
      </div>
      <textarea id="text" placeholder="例如：持续 3 轮，每轮 1d6 火焰伤害，可被水熄灭。"></textarea>

      <div class="modal-status">
        存档（跨场景复用）请在左侧「附件描述」面板的卡片上点「存档」。
      </div>

      <div class="modal-actions">
        <button class="btn" id="cancel">取消</button>
        <button class="btn primary" id="save">保存描述</button>
      </div>
    </div>
  </body>
</html>
